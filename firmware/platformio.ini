; ============================================================
;  制冰机手指机器人  Ice Finger Bot
;  主控: ESP32-S3 (当前实际使用, 4MB Flash)
;        ESP32-C3 也支持: -e esp32-c3-devkitm-1
;  舵机: SG90 (5V 独立供电, 信号接 GPIO4)
; ============================================================
; 说明:
;   1) 固定使用 espressif32 6.9.0 (Arduino core 2.0.17)，
;      因为舵机使用 ledcSetup/ledcWrite 经典 API。
;   2) 依赖只有 ArduinoJson 一个，其余全部用 Arduino core 自带库。
;   3) 默认环境 = C3；要用 S3 时加 -e esp32-s3-devkitc-1。
; ============================================================

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-c3-devkitm-1]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    bblanchon/ArduinoJson@^6.21.5


; ------------------------------------------------------------
; 备选目标：ESP32-S3（当前主力）
; 用法: pio run -e esp32-s3-devkitc-1 -t upload
; 注意: 手头这块 Adafruit ESP32-S3 只有 4MB Flash，
;       必须把 flash_size 改成 4MB，否则镜像头 8MB 会导致启动失败
;       （Detected size(4096k) smaller than the size in the binary image header(8192k)）
; ------------------------------------------------------------
[env:esp32-s3-devkitc-1]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; 按实际 Flash 大小覆盖板型默认值（8MB -> 4MB）
board_upload.flash_size = 4MB
board_upload.maximum_size = 1310720
board_build.flash_size = 4MB
board_build.partitions = default.csv
; 这块板子是"封装 Flash + PSRAM"模组（S3FH4R2 类似），只认 DOUT：
; 用 DIO 会无限重启（串口只有 ESP-ROM 循环）。换板启动不了先改这两行。
board_upload.flash_mode = dout
board_upload.flash_freq = 40m

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIN_BTN=0

lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    knolleary/PubSubClient@^2.8

; 板子是 N8R8/N16R8（带 PSRAM）且需要 PSRAM 时再解开:
; build_flags = -DBOARD_HAS_PSRAM
