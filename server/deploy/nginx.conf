# Nginx 反向代理（放在 /etc/nginx/sites-available/icebot 并软链到 sites-enabled）
#
# 前置：域名 A 记录指向服务器公网 IP；证书用 certbot 申请（见 docs/server.md）
# 假设域名：ice.example.com

server {
    listen 80;
    listen [::]:80;
    server_name ice.example.com;

    # certbot 验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ice.example.com;

    ssl_certificate     /etc/letsencrypt/live/ice.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ice.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    # 小程序不需要 HSTS，但浏览器访问有好处
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 64k;

    # 设备轮询 + 小程序接口都走这里
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    # 简单的限流（按 IP），防止被刷
    limit_req zone=icebot burst=20 nodelay;
}

# 放在 http {} 块里（或在 /etc/nginx/conf.d/ 单独定义）：
# limit_req_zone $binary_remote_addr zone=icebot:10m rate=10r/s;
