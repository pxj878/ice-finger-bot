; ============================================================
;  本地验证配置模板（复制成 platformio.local.ini 后修改）
;  ------------------------------------------------------------
;  用途：
;    1) 把 WiFi 直接编译进固件，省去首次配网
;    2) 提供 SELFTEST 自检环境（不开 WiFi 也能测接口）
;
;  用法：
;    cp platformio.local.example.ini platformio.local.ini   # 然后填下面的值
;    pio run -c platformio.local.ini -e s3-verify -t upload
;
;  注意：platformio.local.ini 已在 .gitignore 里，不会被提交。
; ============================================================

[env:s3-verify]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ---- 4MB Flash 板子必填（8MB 板子请删掉这 4 行）----
board_upload.flash_size = 4MB
board_upload.maximum_size = 1310720
board_build.flash_size = 4MB
board_build.partitions = default.csv

; ---- 如果板子启动不了（串口只刷 ESP-ROM），加下面两行试 DOUT ----
; board_upload.flash_mode = dout
; board_upload.flash_freq = 40m

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIN_BTN=0
    ; ↓↓↓ 改成你自己的 WiFi（2.4GHz）↓↓↓
    -DDEFAULT_WIFI_SSID='"YOUR_WIFI_SSID"'
    -DDEFAULT_WIFI_PASS='"YOUR_WIFI_PASSWORD"'

lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    knolleary/PubSubClient@^2.8

; ------------------------------------------------------------
; 自检环境：不开 WiFi，直接对本机 80 端口发请求，验证 Web/JSON/任务/舵机
; ------------------------------------------------------------
[env:s3-selftest]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 4MB
board_upload.maximum_size = 1310720
board_build.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIN_BTN=0
    -DSELFTEST
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    knolleary/PubSubClient@^2.8
