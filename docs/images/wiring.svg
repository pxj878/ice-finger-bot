<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="520" fill="#0e1116"/>
  <text x="430" y="38" fill="#e6ebf2" font-size="22" font-weight="600" text-anchor="middle">接线图 · ESP32-S3 + SG90</text>
  <text x="430" y="62" fill="#8b97a8" font-size="13" text-anchor="middle">关键：舵机用外部 5V 供电，且 ESP32 与舵机必须共地</text>

  <!-- 外部 5V 电源 -->
  <rect x="40" y="100" width="190" height="120" rx="12" fill="#171c24" stroke="#2d3646"/>
  <text x="135" y="130" fill="#e6ebf2" font-size="15" text-anchor="middle">外部 5V 电源</text>
  <text x="135" y="152" fill="#8b97a8" font-size="12" text-anchor="middle">5V / 2A 适配器或充电宝</text>
  <circle cx="95" cy="190" r="6" fill="#ff5c5c"/>
  <text x="110" y="195" fill="#ff8a8a" font-size="13">+ 5V</text>
  <circle cx="195" cy="190" r="6" fill="#4a5568"/>
  <text x="150" y="215" fill="#8b97a8" font-size="12">− GND</text>

  <!-- ESP32-S3 -->
  <rect x="330" y="250" width="230" height="180" rx="12" fill="#171c24" stroke="#3b82f6" stroke-width="2"/>
  <text x="445" y="282" fill="#e6ebf2" font-size="16" text-anchor="middle" font-weight="600">ESP32-S3</text>
  <text x="445" y="303" fill="#8b97a8" font-size="12" text-anchor="middle">（USB-C 供电 / 烧录）</text>
  <text x="352" y="340" fill="#7dd3fc" font-size="13">GPIO4</text>
  <text x="352" y="375" fill="#9aa7b8" font-size="13">GND</text>
  <text x="352" y="410" fill="#9aa7b8" font-size="13">3V3</text>
  <circle cx="345" cy="335" r="4" fill="#7dd3fc"/>
  <circle cx="345" cy="370" r="4" fill="#9aa7b8"/>
  <circle cx="345" cy="405" r="4" fill="#9aa7b8"/>

  <!-- SG90 -->
  <rect x="630" y="100" width="190" height="150" rx="12" fill="#171c24" stroke="#f59e0b" stroke-width="2"/>
  <text x="725" y="130" fill="#e6ebf2" font-size="16" text-anchor="middle" font-weight="600">SG90 舵机</text>
  <text x="725" y="152" fill="#8b97a8" font-size="12" text-anchor="middle">9g 微型舵机</text>
  <text x="648" y="185" fill="#fbbf24" font-size="13">橙 信号</text>
  <text x="648" y="210" fill="#ff8a8a" font-size="13">红 +5V</text>
  <text x="648" y="235" fill="#9aa7b8" font-size="13">棕 GND</text>
  <circle cx="635" cy="180" r="4" fill="#fbbf24"/>
  <circle cx="635" cy="205" r="4" fill="#ff5c5c"/>
  <circle cx="635" cy="230" r="4" fill="#4a5568"/>

  <!-- 线：5V+ 到舵机 -->
  <path d="M95 184 L95 86 L725 86 L725 196" stroke="#ff5c5c" stroke-width="3" fill="none"/>
  <text x="400" y="78" fill="#ff8a8a" font-size="12">红：+5V</text>

  <!-- 线：GND 电源到舵机 -->
  <path d="M195 196 L195 486 L760 486 L760 238" stroke="#6b7280" stroke-width="3" fill="none"/>
  <text x="430" y="502" fill="#9aa7b8" font-size="12">棕：GND（舵机电源负极）</text>

  <!-- 线：ESP32 GND 到 GND 母线 -->
  <path d="M330 370 L280 370 L280 486" stroke="#6b7280" stroke-width="3" fill="none"/>
  <text x="160" y="440" fill="#9aa7b8" font-size="12">ESP32 GND 必须接同一条 GND</text>

  <!-- 线：GPIO4 到舵机信号 -->
  <path d="M330 335 L480 335 L480 180 L630 180" stroke="#fbbf24" stroke-width="3" fill="none"/>
  <text x="500" y="168" fill="#fbbf24" font-size="12">橙：PWM 信号 → GPIO4</text>

  <!-- 电容提示 -->
  <rect x="60" y="300" width="220" height="86" rx="10" fill="#1b2230" stroke="#2d3646"/>
  <text x="170" y="326" fill="#93c5fd" font-size="13" text-anchor="middle">建议加 470~1000µF 电容</text>
  <text x="170" y="348" fill="#8b97a8" font-size="11.5" text-anchor="middle">并联在舵机电源 ± 之间</text>
  <text x="170" y="368" fill="#8b97a8" font-size="11.5" text-anchor="middle">抑制启动瞬间电压跌落</text>

  <!-- 手指提示 -->
  <rect x="600" y="300" width="230" height="86" rx="10" fill="#1b2230" stroke="#2d3646"/>
  <text x="715" y="326" fill="#93c5fd" font-size="13" text-anchor="middle">摆臂 + 手指</text>
  <text x="715" y="348" fill="#8b97a8" font-size="11.5" text-anchor="middle">对准制冰机按钮，间隙 3~8mm</text>
  <text x="715" y="368" fill="#8b97a8" font-size="11.5" text-anchor="middle">角度用网页「舵机校准」调</text>
</svg>
